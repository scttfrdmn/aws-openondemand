name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # L1: actions/checkout@v7.0.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # L1: setup-terraform@v4.0.1

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate

  cdk:
    name: CDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cdk
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # L1: actions/checkout@v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # L1: setup-node@v7.0.0
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (type check)
        run: npm run build

      - name: Lint
        run: npm run lint

  packer:
    name: Packer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # L1: actions/checkout@v7.0.0

      - uses: hashicorp/setup-packer@ce93c3c08a6c2ff2275bf4b54ff0d9a75f6c9789 # L1: setup-packer@v3.4.0
        with:
          version: "1.11.2" # Pin to specific version for reproducible AMI builds

      - name: Init Packer plugins
        run: packer init packer/ood.pkr.hcl

      - name: Validate Packer template
        run: packer validate packer/ood.pkr.hcl

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # L1: actions/checkout@v7.0.0

      # H5: CKV_AWS_79 (IMDSv2) is suppressed in .checkov.yaml because checkov cannot detect
      # metadata_options inside a dynamic block. This grep step ensures the suppression is
      # valid — if http_tokens="required" is removed, this step fails and blocks the PR.
      - name: Verify IMDSv2 enforcement (CKV_AWS_79 suppression guard)
        run: |
          grep -q 'http_tokens.*=.*"required"' terraform/main.tf || {
            echo "ERROR: IMDSv2 enforcement (http_tokens = \"required\") not found in terraform/main.tf"
            echo "       CKV_AWS_79 is suppressed in .checkov.yaml assuming this control is present."
            echo "       Either restore the metadata_options block or remove the suppression."
            exit 1
          }

      - name: tfsec (Terraform static analysis)
        uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # L1: tfsec-action@v1.0.3
        with:
          working_directory: terraform
          soft_fail: false

      - name: checkov (IaC policy scan)
        uses: bridgecrewio/checkov-action@7b972723c44fb3d256283fac96fae5d7c1894bb7 # v12.1347.0 (the old v3.2.2 pin no longer resolves — action retagged to CalVer)
        with:
          directory: terraform
          framework: terraform
          soft_fail: false
          # Suppressions are documented in .checkov.yaml at repo root (H6)
          config_file: .checkov.yaml

      - name: trivy (secret scan)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # M1: pinned v0.36.0 — @master is mutable
        with:
          scan-type: fs
          scan-ref: "."
          scanners: secret
          exit-code: "1"
          severity: HIGH,CRITICAL
